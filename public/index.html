<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a2c22">
<title>麻将联机 · 哈尔滨 / 双鸭山</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f4a37'/%3E%3Crect x='12' y='10' width='40' height='44' rx='6' fill='%23f6f1e2'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23b3352c'%3E中%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="app">
  <!-- ============ 首页 ============ -->
  <section id="home" class="screen">
    <div class="home-bg"></div>
    <div class="home-inner">
      <header class="home-head">
        <div class="logo-mark">中</div>
        <div>
          <h1>麻将联机</h1>
          <p class="tagline">哈尔滨麻将 · 双鸭山麻将　开房即玩，一条链接拉人</p>
        </div>
      </header>

      <div class="home-grid">
        <div class="card">
          <div class="card-title">创建房间</div>
          <label class="field">
            <span>昵称</span>
            <input id="nickname" maxlength="12" placeholder="给自己起个名" autocomplete="nickname">
          </label>
          <div class="field">
            <span>玩法</span>
            <div class="rule-picker" id="rulePicker"></div>
          </div>
          <div class="opt-row">
            <label class="field small">
              <span>局数</span>
              <select id="optRounds">
                <option value="4">4 局</option>
                <option value="8" selected>8 局</option>
                <option value="16">16 局</option>
              </select>
            </label>
            <label class="field small">
              <span>出牌时间</span>
              <select id="optTurn">
                <option value="12">12 秒</option>
                <option value="20" selected>20 秒</option>
                <option value="30">30 秒</option>
              </select>
            </label>
            <label class="field small">
              <span>底分</span>
              <select id="optBase">
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="5">5</option>
              </select>
            </label>
          </div>
          <label class="check"><input type="checkbox" id="optBots" checked> 人数不足自动补人机</label>
          <details class="advanced">
            <summary>高级规则</summary>
            <div class="adv-grid">
              <label class="check"><input type="checkbox" id="optChi" checked> 允许吃牌</label>
              <label class="check"><input type="checkbox" id="optMultiHu"> 一炮多响</label>
              <label class="field small">
                <span>封顶</span>
                <select id="optCap">
                  <option value="16">16</option>
                  <option value="36" selected>36</option>
                  <option value="64">64</option>
                  <option value="128">128</option>
                </select>
              </label>
            </div>
          </details>
          <button id="createBtn" class="btn primary big">创建房间</button>
        </div>

        <div class="card">
          <div class="card-title">加入房间</div>
          <label class="field">
            <span>房间号</span>
            <input id="joinCode" maxlength="8" placeholder="例如 A8K3M" autocapitalize="characters">
          </label>
          <button id="joinBtn" class="btn big">加入房间</button>
          <div class="hint">被朋友邀请？直接点他发的链接，会自动进房。</div>
          <div class="card-title mt">公开房间</div>
          <div id="roomList" class="room-list"><div class="empty">暂无公开房间</div></div>
          <button id="refreshRooms" class="btn ghost small">刷新列表</button>
        </div>
      </div>

      <footer class="home-foot">服务端权威判定 · 断线可重连 · 人机补位 · 手机横竖屏均可</footer>
    </div>
  </section>

  <!-- ============ 房间 ============ -->
  <section id="room" class="screen hidden">
    <header class="topbar">
      <button id="homeBtn" class="icon-btn" title="返回首页">‹</button>
      <div class="room-title">
        <span id="roomCodeLabel" class="room-code">-----</span>
        <span id="ruleNameLabel" class="pill">--</span>
        <span id="roundLabel" class="pill dim">--</span>
      </div>
      <div class="spacer"></div>
      <button id="rulesBtn" class="icon-btn">规则</button>
      <button id="inviteBtn" class="icon-btn">邀请</button>
      <button id="chatBtn" class="icon-btn">聊天<span id="chatDot" class="dot hidden"></span></button>
      <button id="soundBtn" class="icon-btn" title="音效">🔊</button>
    </header>

    <div id="tableWrap">
      <div id="table">
        <div class="seat-slot slot-n" data-slot="n"></div>
        <div class="seat-slot slot-w" data-slot="w"></div>
        <div class="seat-slot slot-e" data-slot="e"></div>
        <div class="seat-slot slot-s" data-slot="s"></div>
        <div id="center">
          <div class="center-top">
            <div id="wallInfo" class="wall-info"></div>
            <div id="baoInfo" class="bao-info"></div>
          </div>
          <div id="centerMsg" class="center-msg"></div>
          <div id="timerRing" class="timer-ring hidden"><span></span></div>
        </div>
      </div>
    </div>

    <div id="bottomDock">
      <div id="myBar" class="my-bar"></div>
      <div id="actionBar" class="action-bar"></div>
      <div id="handArea" class="hand-area"></div>
    </div>

    <div id="waitOverlay" class="wait-overlay hidden">
      <div class="wait-card">
        <div class="wait-title">等待开局</div>
        <div class="invite-row">
          <input id="inviteInput" readonly>
          <button id="copyInvite" class="btn small">复制链接</button>
        </div>
        <div class="wait-seats" id="waitSeats"></div>
        <div class="wait-actions">
          <button id="readyBtn" class="btn">准备</button>
          <button id="fillBotsBtn" class="btn ghost">补满人机</button>
          <button id="startBtn" class="btn primary">开始游戏</button>
        </div>
        <div class="wait-tip" id="waitTip"></div>
      </div>
    </div>

    <div id="resultOverlay" class="result-overlay hidden">
      <div class="result-card" id="resultCard"></div>
    </div>

    <div id="chatPanel" class="chat-panel hidden">
      <div class="chat-head"><span>牌桌聊天</span><button id="chatClose" class="icon-btn">×</button></div>
      <div id="chatList" class="chat-list"></div>
      <div class="chat-quick" id="chatQuick"></div>
      <div class="chat-input-row">
        <input id="chatInput" maxlength="80" placeholder="说点什么…">
        <button id="chatSend" class="btn small">发送</button>
      </div>
    </div>
  </section>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
